name: One-time project import
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-project.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract unique project files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from io import BytesIO
          import hashlib

          source = Path('files2.zip')
          if not source.is_file():
              raise SystemExit('files2.zip is missing')
          with ZipFile(source) as outer:
              if 'transkript.zip' not in outer.namelist():
                  raise SystemExit('transkript.zip is missing from files2.zip')
              nested = outer.read('transkript.zip')

          seen_paths = set()
          seen_hashes = {}
          written = set()
          with ZipFile(BytesIO(nested)) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  name = PurePosixPath(item.filename)
                  if name.is_absolute() or '..' in name.parts or not name.parts or name.parts[0] != 'transkript':
                      raise SystemExit(f'Unsafe or unexpected archive path: {item.filename}')
                  relative = PurePosixPath(*name.parts[1:])
                  if not relative.parts:
                      continue
                  path = relative.as_posix()
                  if path in seen_paths:
                      raise SystemExit(f'Duplicate archive path: {path}')
                  seen_paths.add(path)
                  data = archive.read(item.filename)
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in seen_hashes:
                      print(f'Skipping duplicate content: {path} (same as {seen_hashes[digest]})')
                      continue
                  seen_hashes[digest] = path
                  target = Path(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  written.add(path)

          required = {
              '.env.example', 'README.md', 'package.json', 'server.js',
              'public/icon.png', 'public/index.html', 'public/manifest.webmanifest',
              'public/sw.js', 'whisperx_service/requirements.txt', 'whisperx_service/service.py'
          }
          missing = required - written
          if missing:
              raise SystemExit('Required project files missing: ' + ', '.join(sorted(missing)))

          source.unlink()
          Path('.github/workflows/import-project.yml').unlink()
          print(f'Imported {len(written)} unique project files.')
          PY
      - name: Commit project files and remove importer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No file changes to commit.'
            exit 0
          fi
          git commit -m 'Import transcription app source files; remove duplicate archive'
          git push origin HEAD:main
